<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bahiana&family=Bitcount+Grid+Single:wght@400&family=Black+And+White+Picture&family=Chelsea+Market&family=Cinzel:wght@600;700&family=Cormorant+Unicase:wght@400;700&family=Crafty+Girls&family=Emilys+Candy&family=Freckle+Face&family=Fredericka+the+Great&family=Frijole&family=Grape+Nuts&family=Iceland&family=Indie+Flower&family=Inter:wght@400;600&family=Life+Savers:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;600;700&family=Rubik+Dirt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rubik+Marker+Hatch&family=Rubik+Vinyl&family=Rubik+Wet+Paint&family=Schoolbell&family=Shadows+Into+Light+Two&family=Silkscreen:wght@400;700&family=Sixtyfour&family=Sofadi+One&family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&family=Syne+Mono&family=Unkempt:wght@400;700&family=Vast+Shadow&family=VT323&family=Workbench&family=Xanh+Mono&display=swap" rel="stylesheet">
  <style>
    /* CONFIGURAÇÃO BASE (CATPPUCCIN MOCHA - DARK) */
    :root {
      --bg-principal: #1e1e2e;
      --bg-card: #181825;
      --bg-card-hover: #313244;
      --borda-suave: #45475a;
      --texto-principal: #cdd6f4;
      --texto-titulo: #f5e0dc;
      --texto-secundario: #a6adc8;
      --detalhe-accent: #cba6f7;
      --detalhe-hover: #b4befe;
      --fonte-titulo: 'Outfit', sans-serif;
      --fonte-corpo: 'Merriweather', serif;
      --cor-sistema: #89b4fa;
    }
    body {
      background-color: var(--bg-principal) !important;
      color: var(--texto-principal) !important;
      margin: 0;
      padding: 0;
    }

    /* TIPOGRAFIA */
    h1, h2, h3, h4 {
      font-family: var(--fonte-titulo) !important;
      color: var(--texto-titulo) !important;
    }

    /* 1. Fonte e estilos padrão do capítulo */
    .post-content, .post-content p {
      font-family: var(--fonte-corpo) !important;
      line-height: 2 !important;
      color: var(--texto-principal) !important;
    }
    
    a {
      color: var(--detalhe-accent) !important;
      transition: color 0.2s ease;
    }
    a:hover {
      color: var(--detalhe-hover) !important;
    }
    
    /* 2. Sobrescreve as fontes do leitor (body.font-*) para as classes especiais */
    
    /* --- Maquininha / Monospaçadas / Especiais --- */
    body[class*="font-"] .post-content p.f-special, body[class*="font-"] .post-content .f-special, body[class*="font-"] .post-content .f-special *, .post-content p.f-special { font-family: 'Special Elite', cursive !important; }
    body[class*="font-"] .post-content p.f-syne, body[class*="font-"] .post-content .f-syne, body[class*="font-"] .post-content .f-syne *, .post-content p.f-syne          { font-family: 'Syne Mono', monospace !important; }
    body[class*="font-"] .post-content p.f-xanh, body[class*="font-"] .post-content .f-xanh, body[class*="font-"] .post-content .f-xanh *, .post-content p.f-xanh          { font-family: 'Xanh Mono', monospace !important; }
    
    /* --- Retro / Pixel / Games --- */
    body[class*="font-"] .post-content p.f-bitcount, body[class*="font-"] .post-content .f-bitcount, body[class*="font-"] .post-content .f-bitcount *, .post-content p.f-bitcount { font-family: 'Bitcount Grid Single', monospace !important; }
    body[class*="font-"] .post-content p.f-iceland, body[class*="font-"] .post-content .f-iceland, body[class*="font-"] .post-content .f-iceland *, .post-content p.f-iceland   { font-family: 'Iceland', sans-serif !important; }
    body[class*="font-"] .post-content p.f-silkscreen, body[class*="font-"] .post-content .f-silkscreen, body[class*="font-"] .post-content .f-silkscreen *, .post-content p.f-silkscreen { font-family: 'Silkscreen', monospace !important; }
    body[class*="font-"] .post-content p.f-sixtyfour, body[class*="font-"] .post-content .f-sixtyfour, body[class*="font-"] .post-content .f-sixtyfour *, .post-content p.f-sixtyfour   { font-family: 'Sixtyfour', monospace !important; }
    body[class*="font-"] .post-content p.f-vt323, body[class*="font-"] .post-content .f-vt323, body[class*="font-"] .post-content .f-vt323 *, .post-content p.f-vt323         { font-family: 'VT323', monospace !important; }
    
    /* --- Manuscritas --- */
    body[class*="font-"] .post-content p.f-crafty, body[class*="font-"] .post-content .f-crafty, body[class*="font-"] .post-content .f-crafty *, .post-content p.f-crafty     { font-family: 'Crafty Girls', cursive !important; }
    body[class*="font-"] .post-content p.f-grape, body[class*="font-"] .post-content .f-grape, body[class*="font-"] .post-content .f-grape *, .post-content p.f-grape        { font-family: 'Grape Nuts', cursive !important; }
    body[class*="font-"] .post-content p.f-indie, body[class*="font-"] .post-content .f-indie, body[class*="font-"] .post-content .f-indie *, .post-content p.f-indie        { font-family: 'Indie Flower', cursive !important; }
    body[class*="font-"] .post-content p.f-schoolbell, body[class*="font-"] .post-content .f-schoolbell, body[class*="font-"] .post-content .f-schoolbell *, .post-content p.f-schoolbell { font-family: 'Schoolbell', cursive !important; }
    body[class*="font-"] .post-content p.f-shadows, body[class*="font-"] .post-content .f-shadows, body[class*="font-"] .post-content .f-shadows *, .post-content p.f-shadows  { font-family: 'Shadows Into Light Two', cursive !important; }
    body[class*="font-"] .post-content p.f-unkempt, body[class*="font-"] .post-content .f-unkempt, body[class*="font-"] .post-content .f-unkempt *, .post-content p.f-unkempt  { font-family: 'Unkempt', cursive !important; }
    
    /* --- Efeitos Especiais --- */
    body[class*="font-"] .post-content p.f-dirt, body[class*="font-"] .post-content .f-dirt, body[class*="font-"] .post-content .f-dirt *, .post-content p.f-dirt           { font-family: 'Rubik Dirt', display !important; }
    body[class*="font-"] .post-content p.f-distressed, body[class*="font-"] .post-content .f-distressed, body[class*="font-"] .post-content .f-distressed *, .post-content p.f-distressed { font-family: 'Rubik Distressed', display !important; }
    body[class*="font-"] .post-content p.f-glitch, body[class*="font-"] .post-content .f-glitch, body[class*="font-"] .post-content .f-glitch *, .post-content p.f-glitch     { font-family: 'Rubik Glitch', display !important; }
    body[class*="font-"] .post-content p.f-hatch, body[class*="font-"] .post-content .f-hatch, body[class*="font-"] .post-content .f-hatch *, .post-content p.f-hatch        { font-family: 'Rubik Marker Hatch', display !important; }
    body[class*="font-"] .post-content p.f-vinyl, body[class*="font-"] .post-content .f-vinyl, body[class*="font-"] .post-content .f-vinyl *, .post-content p.f-vinyl        { font-family: 'Rubik Vinyl', display !important; }
    body[class*="font-"] .post-content p.f-paint, body[class*="font-"] .post-content .f-paint, body[class*="font-"] .post-content .f-paint *, .post-content p.f-paint        { font-family: 'Rubik Wet Paint', display !important; }
    body[class*="font-"] .post-content p.f-freckle, body[class*="font-"] .post-content .f-freckle, body[class*="font-"] .post-content .f-freckle *, .post-content p.f-freckle  { font-family: 'Freckle Face', display !important; }
    body[class*="font-"] .post-content p.f-fredericka, body[class*="font-"] .post-content .f-fredericka, body[class*="font-"] .post-content .f-fredericka *, .post-content p.f-fredericka { font-family: 'Fredericka the Great', serif !important; }
    body[class*="font-"] .post-content p.f-frijole, body[class*="font-"] .post-content .f-frijole, body[class*="font-"] .post-content .f-frijole *, .post-content p.f-frijole  { font-family: 'Frijole', display !important; }
    body[class*="font-"] .post-content p.f-workbench, body[class*="font-"] .post-content .f-workbench, body[class*="font-"] .post-content .f-workbench *, .post-content p.f-workbench { font-family: 'Workbench', monospace !important; }
    
    /* --- Fantasia / Títulos --- */
    body[class*="font-"] .post-content p.f-bahiana, body[class*="font-"] .post-content .f-bahiana, body[class*="font-"] .post-content .f-bahiana *, .post-content p.f-bahiana  { font-family: 'Bahiana', display !important; }
    body[class*="font-"] .post-content p.f-blackwhite, body[class*="font-"] .post-content .f-blackwhite, body[class*="font-"] .post-content .f-blackwhite *, .post-content p.f-blackwhite { font-family: 'Black And White Picture', sans-serif !important; }
    body[class*="font-"] .post-content p.f-chelsea, body[class*="font-"] .post-content .f-chelsea, body[class*="font-"] .post-content .f-chelsea *, .post-content p.f-chelsea  { font-family: 'Chelsea Market', display !important; }
    body[class*="font-"] .post-content p.f-cormorant, body[class*="font-"] .post-content .f-cormorant, body[class*="font-"] .post-content .f-cormorant *, .post-content p.f-cormorant { font-family: 'Cormorant Unicase', serif !important; }
    body[class*="font-"] .post-content p.f-candy, body[class*="font-"] .post-content .f-candy, body[class*="font-"] .post-content .f-candy *, .post-content p.f-candy        { font-family: 'Emilys Candy', display !important; }
    body[class*="font-"] .post-content p.f-lifesavers, body[class*="font-"] .post-content .f-lifesavers, body[class*="font-"] .post-content .f-lifesavers *, .post-content p.f-lifesavers { font-family: 'Life Savers', cursive !important; }
    body[class*="font-"] .post-content p.f-sofadi, body[class*="font-"] .post-content .f-sofadi, body[class*="font-"] .post-content .f-sofadi *, .post-content p.f-sofadi     { font-family: 'Sofadi One', display !important; }
    body[class*="font-"] .post-content p.f-vast, body[class*="font-"] .post-content .f-vast, body[class*="font-"] .post-content .f-vast *, .post-content p.f-vast           { font-family: 'Vast Shadow', serif !important; }
    body[class*="font-"] .post-content p.f-yuyu, body[class*="font-"] .post-content .f-yuyu, body[class*="font-"] .post-content .f-yuyu *, .post-content p.f-yuyu           { font-family: 'Yuyu', sans-serif !important; }

    /* --- CABEÇALHO --- */
    .site-header { 
      background-color: rgba(24, 24, 37, 0.85) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borda-suave) !important; 
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .site-title, .site-title:visited { 
      color: #f5e0dc !important; 
      font-weight: 700;
      font-family: var(--fonte-titulo) !important;
      text-decoration: none !important;
      transition: opacity 0.2s ease;
    }
    
    .site-title:hover {
      opacity: 0.85;
    }
    
    /* --- GRID E CARDS DE OBRAS --- */
    
    /* Card Container da Obra */
    .card-historia {
      background-color: var(--bg-card) !important;
      border: 1px solid var(--borda-suave) !important;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* Efeito ao passar o mouse / Selecionar */
    .card-historia:hover {
      transform: translateY(-6px);
      border-color: var(--detalhe-accent) !important;
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), 
                  0 0 15px -3px var(--detalhe-accent);
    }
    
    /* Capa da Obra Padronizada (Formato de Livro 2:3) */
    .card-historia img, 
    .capa-obra {
      width: 100% !important;
      aspect-ratio: 2 / 3; /* Mantém a proporção exata de capa de livro */
      object-fit: cover !important; /* Preenche o card sem esticar ou deformar */
      border-radius: 0;
      display: block;
      transition: transform 0.5s ease;
    }
    
    /* Zoom suave na capa ao passar o mouse */
    .card-historia:hover img,
    .card-historia:hover .capa-obra {
      transform: scale(1.04);
    }
    
    /* Container da imagem para efeito de gradiente e zoom */
    .capa-container {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    
    /* Sombreamento degradê na base da imagem */
    .capa-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(to top, var(--bg-card), transparent);
      pointer-events: none;
    }

        /* Esconde o cabeçalho do tema principal apenas nas páginas de leitura/capítulos */
    body.layout--post .site-header,
    .navbar-leitura ~ .site-header {
      display: none !important;
    }
    /* JANELA DO SISTEMA */
    .system-window {
      background: var(--bg-card) !important;
      border: 1px solid var(--cor-sistema);
      border-left: 4px solid var(--cor-sistema);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 25px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center !important;
      color: var(--texto-principal);
    }

    .system-header {
      font-family: var(--fonte-titulo) !important;
      font-size: 0.95rem !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cor-sistema) !important;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .system-content {
      font-family: inherit;
      font-size: inherit !important;
      line-height: 1.6 !important;
      color: var(--texto-principal) !important;
    }

    /* GARANTE QUE O CONTEÚDO FIQUE SEMPRE CENTRALIZADO E LIMPANDO OVERFLOW */
    .wrapper, .page-content {
      overflow-x: hidden !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    .post-content {
      width: 100% !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
    }

        /* FORÇA O ALINHAMENTO DO TEXTO CENTRALIZADO NO MOBILE */
    .post-content p {
      text-align: left !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    .post-content {
      display: block !important;
      float: none !important;
      clear: both !important;
      margin: 0 auto !important;
    }

    /* Sobrescreve a cor do botão Start/Continue Reading em qualquer tema */
    #btn-continuar-lendo {
      color: #11111b !important;
      background-color: var(--detalhe-accent) !important;
    }
    
    /* ============================================================
       ESTILIZAÇÃO DA BARRA DE LEITURA (NAVBAR DO TOPO)
       ============================================================ */
    
    .reader-navbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 1000 !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 10px 16px !important;
      background-color: var(--bg-card, #181825) !important;
      border-bottom: 1px solid var(--borda-suave, #45475a) !important;
      gap: 8px !important;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-sizing: border-box !important;
    }
    
    .reader-navbar.nav-hidden {
      transform: translateY(-100%) !important;
    }
    
    .nav-group {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
    }
    
    .left-group { justify-content: flex-start !important; }
    .center-group { justify-content: center !important; }
    .right-group { justify-content: flex-end !important; }
    
    /* Botões da Navbar (Home / Story) com Caixinha */
    .reader-navbar .btn-nav {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      background-color: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid var(--borda-suave, #45475a) !important;
      color: var(--texto-principal, #cdd6f4) !important;
      padding: 6px 12px !important;
      border-radius: 8px !important;
      font-size: 0.85rem !important;
      text-decoration: none !important;
      transition: all 0.2s ease !important;
      white-space: nowrap !important;
    }
    
    .reader-navbar .btn-nav:hover {
      border-color: var(--detalhe-accent, #cba6f7) !important;
      color: var(--detalhe-accent, #cba6f7) !important;
    }
    
    .reader-navbar .btn-icon {
      color: var(--texto-secundario, #a6adc8) !important;
      text-decoration: none !important;
      font-size: 1.1rem !important;
      padding: 2px 6px !important;
    }
    
    /* Seletor de Capítulos Ajustável (Sem cortar no celular) */
    .reader-navbar .chapter-select {
      background-color: var(--bg-card, #181825) !important;
      color: var(--texto-principal, #cdd6f4) !important;
      border: 1px solid var(--borda-suave, #45475a) !important;
      padding: 6px 12px !important;
      border-radius: 8px !important;
      font-size: 0.85rem !important;
      outline: none !important;
      cursor: pointer !important;
      min-width: 110px !important;
      max-width: 200px !important;
      text-overflow: ellipsis !important;
    }
    
    .btn-formatting {
      background-color: var(--detalhe-accent, #cba6f7) !important;
      color: #11111b !important;
      border: none !important;
      padding: 6px 14px !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
      cursor: pointer !important;
      white-space: nowrap !important;
    }
    
    /* ============================================================
       ESTILIZAÇÃO DOS BOTÕES DE NAVEGAÇÃO INFERIOR (PREV / ☰ / NEXT)
       ============================================================ */
    
    .nav-capitulo-bottom {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      gap: 12px !important;
      margin: 20px 0 30px 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    .nav-capitulo-bottom .btn-bottom {
      flex: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 12px 16px !important;
      background-color: var(--bg-card, #181825) !important;
      border: 1px solid var(--borda-suave, #45475a) !important;
      color: var(--texto-principal, #cdd6f4) !important;
      border-radius: 10px !important;
      font-size: 0.9rem !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      transition: all 0.2s ease !important;
      text-align: center !important;
    }
    
    .nav-capitulo-bottom .btn-bottom:hover {
      border-color: var(--detalhe-accent, #cba6f7) !important;
      color: var(--detalhe-accent, #cba6f7) !important;
    }
    
    /* Destaque no botão NEXT (como na foto de exemplo) */
    .nav-capitulo-bottom .btn-bottom-next {
      background-color: var(--detalhe-accent, #cba6f7) !important;
      color: #11111b !important;
      border: none !important;
    }
    
    .nav-capitulo-bottom .btn-bottom-next:hover {
      opacity: 0.9 !important;
      color: #11111b !important;
    }
    
    .nav-capitulo-bottom .btn-placeholder {
      flex: 1 !important;
    }
    
    /* TEMAS DE LEITURA */
    body.theme-dark-pure {
      --bg-principal: #121212 !important;
      --bg-card: #0D0D0D !important;
      --bg-card-hover: #242424 !important;
      --texto-principal: #E0E0E0 !important;
      --texto-secundario: #9CA3AF !important;
      --texto-titulo: #E2E8F0 !important;
      --borda-suave: #696969 !important;
      --detalhe-accent: #8591A8 !important;
      --detalhe-hover: #5F6D87 !important;
      --cor-sistema: #89b4fa !important;
    }

    body.theme-sepia {
      --bg-principal: #f4ecd8 !important;
      --bg-card: #e8dfca !important;
      --bg-card-hover: #dfd4bc !important;
      --texto-principal: #433422 !important;
      --texto-titulo: #2c1d11 !important;
      --texto-secundario: #977A55 !important;
      --borda-suave: #d3c4a5 !important;
      --detalhe-accent: #8c5a2b !important;
      --detalhe-hover: #6d441f !important;
      --cor-sistema: #8c5a2b !important;
    }

    body.theme-sepia2 {
      --bg-principal: #CFBB99 !important;
      --bg-card: #C7B18B !important;
      --bg-card-hover: #CFB384 !important;
      --texto-principal: #4C3D19 !important;
      --texto-titulo: #2c1d11 !important;
      --texto-secundario: #9C8143 !important;
      --borda-suave: #9E8960 !important;
      --detalhe-accent: #8c5a2b !important;
      --detalhe-hover: #6d441f !important;
      --cor-sistema: #9C8143 !important;
    }

    body.theme-light {
      --bg-principal: #eff1f5 !important;
      --bg-card: #e6e9ef !important;
      --bg-card-hover: #dce0e8 !important;

          /* EFEITO GLITCH INTENSO */
    .glitch {
      position: relative;
      display: inline-block;
      color: var(--texto-principal);
      font-weight: bold;
      /* Brilho neon de fundo para destacar no texto */
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
    }
    
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }
    
    /* Camada Vermelha/Rosa (Desloca para a esquerda) */
    .glitch::before {
      left: -4px; /* Aumentado o desvio */
      text-shadow: 3px 0 #ff0055, -1px 0 #ff0055;
      animation: glitch-anim-1 0.6s infinite linear alternate-reverse; /* Mais rápido */
    }
    
    /* Camada Azul/Ciano (Desloca para a direita) */
    .glitch::after {
      left: 4px; /* Aumentado o desvio */
      text-shadow: -3px 0 #00e5ff, 1px 0 #00e5ff;
      animation: glitch-anim-2 0.3s infinite linear alternate-reverse; /* Mais rápido */
    }
    
    /* Animação com cortes mais agressivos e salto de posição */
    @keyframes glitch-anim-1 {
      0% { clip: rect(10px, 9999px, 85px, 0); transform: skew(0.6deg); }
      10% { clip: rect(65px, 9999px, 15px, 0); transform: skew(-2deg); }
      20% { clip: rect(30px, 9999px, 70px, 0); transform: translate(-2px, 1px); }
      30% { clip: rect(85px, 9999px, 5px, 0); transform: skew(1.5deg); }
      40% { clip: rect(5px, 9999px, 95px, 0); transform: translate(3px, -1px); }
      50% { clip: rect(50px, 9999px, 30px, 0); transform: skew(-1deg); }
      60% { clip: rect(15px, 9999px, 60px, 0); transform: translate(-3px, 0); }
      70% { clip: rect(90px, 9999px, 10px, 0); transform: skew(2deg); }
      80% { clip: rect(25px, 9999px, 40px, 0); transform: translate(2px, 2px); }
      90% { clip: rect(70px, 9999px, 20px, 0); transform: skew(-0.5deg); }
      100% { clip: rect(40px, 9999px, 80px, 0); transform: translate(0, 0); }
    }
    
    @keyframes glitch-anim-2 {
      0% { clip: rect(80px, 9999px, 10px, 0); transform: translate(2px, -1px); }
      15% { clip: rect(15px, 9999px, 55px, 0); transform: skew(-2deg); }
      30% { clip: rect(50px, 9999px, 25px, 0); transform: translate(-2px, 1px); }
      45% { clip: rect(5px, 9999px, 90px, 0); transform: skew(3deg); }
      60% { clip: rect(70px, 9999px, 35px, 0); transform: translate(3px, 0); }
      75% { clip: rect(30px, 9999px, 65px, 0); transform: skew(-1deg); }
      90% { clip: rect(95px, 9999px, 5px, 0); transform: translate(-1px, -2px); }
      100% { clip: rect(20px, 9999px, 75px, 0); transform: translate(0, 0); }
    }
    
               /* GLITCH: TEXTO PARADO COM CORES EM MOVIMENTO */
    .glitch-static {
      position: relative;
      display: inline-block;
      font-weight: bold;
      color: var(--texto-principal);
    }
    
        /* Camada Rosa (Esquerda) */
    .glitch-static::before {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--texto-principal);
      text-shadow: -0.3px 0 #ff0055;
      clip-path: inset(0 0 0 0);
      /* Alterado de 1.5s para 0.2s */
      animation: glitch-color-1 0.2s infinite ease-in-out alternate;
      pointer-events: none;
    }
    
    /* Camada Ciano (Direita) */
    .glitch-static::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--texto-principal);
      text-shadow: 0.3px 0 #00e5ff;
      clip-path: inset(0 0 0 0);
      /* Alterado de 2s para 0.15s */
      animation: glitch-color-2 0.25s infinite ease-in-out alternate;
      pointer-events: none;
    }
    
    /* Movimento suave apenas da sombra rosa */
    @keyframes glitch-color-1 {
      0%   { text-shadow: -1px 0 #ff0055; opacity: 0.5; }
      50%  { text-shadow: -2px 0 #ff0055; opacity: 0.7; }
      100% { text-shadow: -1.5px 0 #ff0055; opacity: 0.3; }
    }
    
    /* Movimento suave apenas da sombra ciano */
    @keyframes glitch-color-2 {
      0%   { text-shadow: 1.5px 0 #00e5ff; opacity: 0.3; }
      50%  { text-shadow: 2px 0 #00e5ff; opacity: 0.7; }
      100% { text-shadow: 1px 0 #00e5ff; opacity: 0.4; }
    }

     /* CAIXA COM SCROLL PARA A LISTA DE CAPÍTULOS */

      border: 1px solid var(--borda-suave, rgba(255, 255, 255, 0.1));
      border-radius: 8px;

        /* CONTAINER DA SINOPSE EXPANSÍVEL */
    .synopsis-container {
      position: relative;
      max-height: 120px; /* Altura inicial fechada */
      overflow: hidden;
      transition: max-height 0.4s ease-in-out;
      background-color: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 10px;
    }
    
    /* Efeito de sombreamento/fade na borda inferior quando fechado */
    .synopsis-container::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: linear-gradient(transparent, var(--bg-card));
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    /* Estado Expandido */
    .synopsis-container.expanded {
      max-height: 1000px; /* Altura grande o suficiente para o texto completo */
    }
    
    .synopsis-container.expanded::after {
      opacity: 0; /* Oculta o efeito fade quando aberto */
    }
    
    /* Botão de Alternar */

      background: transparent;
      border: 1px solid var(--borda-suave);
      color: var(--texto-principal);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      ;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    
    .btn-toggle-synopsis:hover {

        /* ==========================================
       ESTILOS ESPECIAIS PARA CAPÍTULOS
       ========================================== */
    
    /* 1. CAIXA DE DM / CHAT */
        .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      /* Utiliza o fundo de card e borda do tema ativo */
      background-color: var(--bg-card);
      border: 1px solid var(--borda-suave, rgba(255, 255, 255, 0.1));
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      font-family: inherit;

    /* Balão da Mensagem Recebida (Esquerda) */
    .chat-msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    
    .chat-msg.received {
      align-self: flex-start;
      /* Adapta o fundo do balão e o texto de acordo com o tema */
      background-color: var(--borda-suave, rgba(255, 255, 255, 0.08));
      color: var(--texto-principal);
      border-bottom-left-radius: 4px;
    }
    
    /* Balão da Mensagem Enviada (Direita) */
    .chat-msg.sent {
      align-self: flex-end;
      /* Usa a cor de destaque do tema (accent) para o balão do leitor/remetente */
      background-color: var(--detalhe-accent, #2563eb);
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }
    
    .chat-author {
      font-size: 0.75rem;
      opacity: 0.75;
      margin-bottom: 3px;

      border: 1px solid #52525b;
      border-radius: 8px;
      padding: 14px 20px;
      margin: 20px auto;
      max-width: 100%;
      font-weight: 500;
      color: #e4e4e7;

      text-align: center;
      background-color: #A89206; /* Exemplo: Roxo escuro (mude a cor se quiser) */
      border-left: 4px solid #a855f7; /* Detalhe lateral elegante */

      padding: 16px 20px;
      margin: 20px 0;
      color: #f3e8ff;

        /* Tooltip/Glossário para a Webnovel */
    .tooltip-container {
      position: relative;
      display: inline-block;
      cursor: pointer;
      border-bottom: 2px dotted var(--detalhe-accent);
    }
    
        .tooltip-text {
      visibility: hidden;
      /* Define largura máxima adaptável para telas pequenas */
      width: max-content;
      max-width: 220px; 
      background-color: var(--bg-card);
      color: var(--texto-principal);
      text-align: center;
      border: 1px solid var(--detalhe-accent);
      border-radius: 6px;
      padding: 8px 10px;
      position: absolute;
      z-index: 99;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      font-weight: normal;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    
      /* IMPORTANTE: Evita que o texto quebre ou transborde a tela */
      white-space: normal;
      word-wrap: break-word;
    }
    
    .tooltip-container:hover .tooltip-text,
    .tooltip-container:focus .tooltip-text {
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* Classe do texto arco-íris em direção única */
    .texto-rainbow {
      /* Gradiente duplicado para fazer a emenda perfeita no loop */
      background: linear-gradient(
        90deg, 
        #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, 
        #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000
      );
      /* Dobra o tamanho do gradiente para permitir o ciclo infinito */
      background-size: 200% 100%;
      
      /* Aplica o fundo recortado no texto */
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      
      /* linear = velocidade constante | 4s = tempo do ciclo completo */
      animation: rainbow-loop 4s linear infinite !important;
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}

      {% if page.layout == "post" %}
        <!-- SEÇÃO DE COMENTÁRIOS (GISCUS) -->
        <section style="margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--borda-suave);">
          <h3 style="font-family: var(--fonte-titulo); color: var(--detalhe-accent); margin-bottom: 20px;">
            🗨 Comments
          </h3>
          
          <div class="giscus"></div>
      
          <script src="https://giscus.app/client.js"
                  data-repo="soleumn/soleumn.github.io"
                  data-repo-id="R_kgDOUW772g"
                  data-category="Announcements"
                  data-category-id="DIC_kwDOUW772s4DFZrd"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="top"
                  data-theme="catppuccin_mocha"
                  data-lang="en"
                  crossorigin="anonymous"
                  async>
          </script>
        </section>
      {% endif %}
    </div>
  </main>

<!-- SCRIPT GLOBAL DO LEITOR (MUDANÇA DE TEMA/FONTE/ESPAÇAMENTO/GISCUS) -->
  <script>
    let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 1.18;
    let currentFont = localStorage.getItem('reader_font_family') || 'literata';
    let currentSpacing = localStorage.getItem('reader_spacing') || 'normal';
    let currentTheme = localStorage.getItem('reader_theme') || 'mocha';
    
    const fonts = [
      { id: 'georgia', name: 'Georgia' },
      { id: 'literata', name: 'Literata' },
      { id: 'lora', name: 'Lora' },
      { id: 'outfit', name: 'Outfit' },
      { id: 'inter', name: 'Inter' },
      { id: 'spectral', name: 'Spectral' }
    ];

    const spacings = [
      { id: 'compact', name: '⬍ Fair' },
      { id: 'normal', name: '⬍ Normal' },
      { id: 'relaxed', name: '⬍ Wide' }
    ];

    /* FUNÇÃO PARA ATUALIZAR O TEMA DO GISCUS VIA POSTMESSAGE */
    function updateGiscusTheme(siteTheme) {
      const giscusThemeMap = {
        'mocha': 'catppuccin_mocha',
        'dark-pure': 'dark',
        'sepia': 'gruvbox_light',
        'sepia2': 'gruvbox',
        'light': 'light',
        'nordic': 'dark_dimmed',
        'emerald': 'dark_dimmed',
        'gruvbox': 'gruvbox'
      };

      const targetGiscusTheme = giscusThemeMap[siteTheme] || 'catppuccin_mocha';
      const iframe = document.querySelector('iframe.giscus-frame');
      
      if (!iframe) return;

      iframe.contentWindow.postMessage(
        {
          giscus: {
            setConfig: {
              theme: targetGiscusTheme
            }
          }
        },
        'https://giscus.app'
      );
    }

    function applyReaderSettings() {
      const paragraphs = document.querySelectorAll('.post-content, .post-content p, .system-window, .system-content');
      paragraphs.forEach(p => {
        p.style.fontSize = currentFontSize + 'rem';
      });
    
      document.body.classList.remove('font-georgia', 'font-literata', 'font-lora', 'font-outfit', 'font-inter', 'font-spectral');
      document.body.classList.add('font-' + currentFont);
    
      const btnFont = document.getElementById('btnFont');
      const fontObj = fonts.find(f => f.id === currentFont);
      if (btnFont && fontObj) {
        btnFont.innerText = fontObj.name;
      }

      document.body.classList.remove('spacing-compact', 'spacing-normal', 'spacing-relaxed');
      document.body.classList.add('spacing-' + currentSpacing);
    
      const btnSpacing = document.getElementById('btnSpacing');
      const spaceObj = spacings.find(s => s.id === currentSpacing);
      if (btnSpacing && spaceObj) {
        btnSpacing.innerText = spaceObj.name;
      }
    
      // Remove todas as classes de temas anteriores
      document.body.classList.remove('theme-dark-pure', 'theme-sepia', 'theme-sepia2', 'theme-light', 'theme-nordic', 'theme-emerald', 'theme-gruvbox');
      if (currentTheme !== 'mocha') {
        document.body.classList.add('theme-' + currentTheme);
      }
    
      // Atualiza o texto do botão "btnTheme" no leitor
      const btnTheme = document.getElementById('btnTheme');
      if (btnTheme) {
        const themeNames = {
          'mocha': '☕ Mocha',
          'dark-pure': '🌙 Dark',
          'sepia': '📜 Sepia',
          'sepia2': '🪶 Sepia2',
          'light': '☀️ Light',
          'nordic': '❄ Nordic',
          'emerald': '🍀 Emerald',
          'gruvbox': '📦 Gruvbox'
        };
        btnTheme.innerText = themeNames[currentTheme] || '🎨 Theme';
      }
    
      // Atualiza o tema dos comentários
      updateGiscusTheme(currentTheme);
    }
    
    function adjustFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta, 0.9), 1.8);
      currentFontSize = Math.round(currentFontSize * 100) / 100;
      localStorage.setItem('reader_font_size', currentFontSize);
      applyReaderSettings();
    }
    
    function cycleFont() {
      let fontIds = fonts.map(f => f.id);
      let nextIndex = (fontIds.indexOf(currentFont) + 1) % fontIds.length;
      currentFont = fontIds[nextIndex];
      localStorage.setItem('reader_font_family', currentFont);
      applyReaderSettings();
    }
    
    function cycleSpacing() {
      let spaceIds = spacings.map(s => s.id);
      let nextIndex = (spaceIds.indexOf(currentSpacing) + 1) % spaceIds.length;
      currentSpacing = spaceIds[nextIndex];
      localStorage.setItem('reader_spacing', currentSpacing);
      applyReaderSettings();
    }
    
    function cycleTheme() {
      const themes = ['mocha', 'dark-pure', 'sepia', 'sepia2', 'light', 'nordic', 'emerald', 'gruvbox'];
      let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      if (nextIndex === -1) nextIndex = 0;
      currentTheme = themes[nextIndex];
      localStorage.setItem('reader_theme', currentTheme);
      applyReaderSettings();
    }
    
    document.addEventListener('DOMContentLoaded', applyReaderSettings);
    
    window.addEventListener('message', function(event) {
      if (event.origin !== 'https://giscus.app') return;
      if (!(typeof event.data === 'object' && event.data.giscus)) return;
      
      updateGiscusTheme(currentTheme);
    });
  </script>
  
</body>
</html>
