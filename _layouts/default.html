<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* PALETA OFICIAL CATPPUCCIN MOCHA */
    :root {
      --bg-principal: #1e1e2e;       /* Base */
      --bg-card: #181825;            /* Mantle */
      --bg-card-hover: #313244;      /* Surface0 */
      --borda-suave: #45475a;        /* Surface1 */
      --texto-principal: #cdd6f4;    /* Text */
      --texto-secundario: #a6adc8;   /* Subtext0 */
      --detalhe-accent: #cba6f7;     /* Mauve */
      --detalhe-hover: #b4befe;      /* Lavender */
      --fonte-titulo: 'Outfit', sans-serif;
      --fonte-corpo: 'Merriweather', serif;
    }

    body {
      background-color: var(--bg-principal) !important;
      color: var(--texto-principal) !important;
    }

    /* TIPOGRAFIA */
    h1, h2, h3, h4 {
      font-family: var(--fonte-titulo) !important;
      color: #f5e0dc !important; /* Rosewater para títulos */
    }

    .post-content, .post-content p {
      font-family: var(--fonte-corpo) !important;
      font-size: 1.18rem !important;
      line-height: 2 !important;
      color: var(--texto-principal) !important;
    }

    /* LINKS */
    a {
      color: var(--detalhe-accent) !important;
      transition: color 0.2s ease;
    }
    a:hover {
      color: var(--detalhe-hover) !important;
    }

    /* CABEÇALHO CATPPUCCIN */
    .site-header { 
      background-color: rgba(24, 24, 37, 0.9) !important;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--borda-suave) !important; 
    }
    .site-title, .site-title:visited { 
      color: #f5e0dc !important; 
      font-weight: 700;
      font-family: var(--fonte-titulo) !important;
      text-decoration: none !important;
    }

    /* AJUSTES PARA A GRADE DE HISTÓRIAS (BIBLIOTECA) */
    .card-historia {
      background: var(--bg-card) !important;
      border: 1px solid var(--borda-suave) !important;
      border-radius: 12px !important;
    }
    .card-historia:hover {
      background: var(--bg-card-hover) !important;
      border-color: var(--detalhe-accent) !important;
    }

    .site-footer { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">
      <!-- O título 'Minhas Histórias' volta a ser clicável para ir para a página inicial -->
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}

      <!-- CAIXA DE COMENTÁRIOS AUTOMÁTICA NOS CAPÍTULOS -->
      {% if page.layout == "post" %}
        <hr style="border-color: #27272a; margin: 50px 0 30px 0;">
        
        <h3 style="font-family: var(--fonte-titulo); margin-bottom: 20px;">🗨 Comments</h3>

        <script src="https://giscus.app/client.js"
                data-repo="soleumn/soleumn.github.io"
                data-repo-id="R_kgDOUW772g"
                data-category="Announcements"
                data-category-id="DIC_kwDOUW772s4DFZrd"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="catppuccin_mocha"
                data-lang="en"
                crossorigin="anonymous"
                async>
        </script>
      {% endif %}
    </div>
  </main>

</body>
</html>
