<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* PALETA E CONFIGURAÇÕES DE BASE (CATPPUCCIN MOCHA) */
    :root {
      --bg-principal: #1e1e2e;
      --bg-card: #181825;
      --bg-card-hover: #313244;
      --borda-suave: #45475a;
      --texto-principal: #cdd6f4;
      --texto-secundario: #a6adc8;
      --detalhe-accent: #cba6f7;
      --detalhe-hover: #b4befe;
      --fonte-titulo: 'Outfit', sans-serif;
      --fonte-corpo: 'Merriweather', serif;
    }

    body {
      background-color: var(--bg-principal) !important;
      color: var(--texto-principal) !important;
      margin: 0;
      padding: 0;
    }

    /* TIPOGRAFIA */
    h1, h2, h3, h4 {
      font-family: var(--fonte-titulo) !important;
      color: #f5e0dc !important;
    }

    .post-content, .post-content p {
      font-family: var(--fonte-corpo) !important;
      line-height: 2 !important;
      color: var(--texto-principal) !important;
    }

    a {
      color: var(--detalhe-accent) !important;
      transition: color 0.2s ease;
    }
    a:hover {
      color: var(--detalhe-hover) !important;
    }

    /* CABEÇALHO */
    .site-header { 
      background-color: rgba(24, 24, 37, 0.9) !important;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--borda-suave) !important; 
    }
    .site-title, .site-title:visited { 
      color: #f5e0dc !important; 
      font-weight: 700;
      font-family: var(--fonte-titulo) !important;
      text-decoration: none !important;
    }

    /* AJUSTE DAS CAPAS DE OBRAS (BIBLIOTECA) */
    .card-historia img, 
    .capa-obra {
      width: 100% !important;
      height: auto !important;
      max-height: 380px;
      object-fit: contain !important; /* Mostra a capa inteira sem cortar as bordas */
      border-radius: 8px 8px 0 0;
      display: block;
    }

    /* JANELA DO SISTEMA (Adaptável a Temas e Fontes) */
    .system-window {
      background: var(--bg-card) !important; /* Ajusta o fundo para o tema atual */
      border: 1px solid var(--detalhe-accent);
      border-left: 4px solid var(--detalhe-accent);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 25px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center !important;
      color: var(--texto-principal) !important;
    }

    .system-header {
      font-family: var(--fonte-titulo) !important; /* Usa a fonte de título estilizada */
      font-size: 0.95rem !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--detalhe-accent) !important;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .system-content {
      font-family: 'Lora', sans-serif !important; /* Fonte moderna para o texto da caixa */
      font-size: 1rem !important;
      line-height: 1.6 !important;
      color: var(--texto-principal) !important;
    }

    /* PAINEL DE LEITURA FLUTUANTE */
    .reader-settings {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .reader-btn {
      background: transparent;
      border: 1px solid var(--borda-suave);
      color: var(--texto-principal);
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-family: var(--fonte-titulo);
      font-size: 0.85rem;
    }

    /* BOTOES DE NAVEGACAO DO CAPITULO (Table of Contents, Save Progress, Next Chapter) */
    .nav-capitulo-container {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      gap: 12px !important;
      margin: 40px 0 !important;
      width: 100% !important;
    }

    .btn-nav {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 10px 18px !important;
      border-radius: 8px !important;
      font-family: var(--fonte-titulo) !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      background-color: var(--bg-card) !important;
      color: var(--texto-principal) !important;
      border: 1px solid var(--borda-suave) !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      box-sizing: border-box !important;
    }

    .btn-nav:hover {
      background-color: var(--bg-card-hover) !important;
      color: #ffffff !important;
      transform: translateY(-2px);
    }

    .btn-next {
      background-color: var(--detalhe-accent) !important;
      color: #11111b !important;
      border: none !important;
    }

    .btn-next:hover {
      background-color: var(--detalhe-hover) !important;
      color: #11111b !important;
    }

    .espacador-nav {
      flex: 1;
    }

    /* VARIÁVEIS DE TEMAS DE LEITURA */
    body.theme-dark-pure {
      --bg-principal: #000000 !important;
      --bg-card: #121212 !important;
      --bg-card-hover: #1e1e1e !important;
      --texto-principal: #e0e0e0 !important;
      --borda-suave: #2a2a2a !important;
    }

    body.theme-sepia {
      --bg-principal: #f4ecd8 !important;
      --bg-card: #e8dfca !important;
      --bg-card-hover: #dfd4bc !important;
      --texto-principal: #433422 !important;
      --borda-suave: #d3c4a5 !important;
      --detalhe-accent: #8c5a2b !important;
      --detalhe-hover: #6d441f !important;
    }

    body.theme-light {
      --bg-principal: #eff1f5 !important;
      --bg-card: #e6e9ef !important;
      --bg-card-hover: #dce0e8 !important;
      --texto-principal: #4c4f69 !important;
      --borda-suave: #ccd0da !important;
      --detalhe-accent: #8839ef !important;
      --detalhe-hover: #7223e5 !important;
    }

    /* VARIÁVEIS DE FONTES */
    body.font-merriweather .post-content, body.font-merriweather .post-content p { font-family: 'Merriweather', serif !important; }
    body.font-lora .post-content, body.font-lora .post-content p { font-family: 'Lora', serif !important; }
    body.font-outfit .post-content, body.font-outfit .post-content p { font-family: 'Outfit', sans-serif !important; }
    body.font-inter .post-content, body.font-inter .post-content p { font-family: 'Inter', sans-serif !important; }

    /* VARIÁVEIS DE ESPAÇAMENTO ENTRE PARÁGRAFOS */
    body.spacing-compact .post-content p { margin-bottom: 0.8rem !important; }
    body.spacing-normal .post-content p { margin-bottom: 1.5rem !important; }
    body.spacing-relaxed .post-content p { margin-bottom: 2.3rem !important; }

    /* =================================================== */
    /* ADAPTAÇÃO PARA CELULARES (RESPONSIVIDADE MOBILE)    */
    /* =================================================== */
    @media (max-width: 768px) {
      .wrapper {
        padding-left: 15px !important;
        padding-right: 15px !important;
      }

      /* Reduz o tamanho das fontes e espaçamentos no celular */
      .post-content, .post-content p {
        line-height: 1.8 !important;
      }

      /* Ajusta a barra flutuante para o centro inferior em celulares */
      .reader-settings {
        bottom: 15px;
        right: 50%;
        transform: translateX(50%);
        padding: 6px 12px;
        gap: 6px;
        width: max-content;
      }

      .reader-btn {
        padding: 4px 8px;
        font-size: 0.8rem;
      }

      /* Garante que imagens e caixas do sistema não estourem a largura da tela */
      img, .system-window {
        max-width: 100% !important;
        box-sizing: border-box !important;
      }

      /* AJUSTE DAS CAPAS NO CELULAR */
      .grid-biblioteca,
      .biblioteca-container {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 20px !important;
      }

      .card-historia img,
      .capa-obra {
        width: 100% !important;
        height: auto !important;
        max-height: 280px !important;
        object-fit: contain !important;
      }

      /* AJUSTE DOS BOTEOS NO CELULAR (Empilha verticalmente para toque fácil) */
      .nav-capitulo-container {
        flex-direction: column !important;
        gap: 10px !important;
      }

      .btn-nav {
        width: 100% !important;
        text-align: center !important;
      }

      .espacador-nav {
        display: none !important;
      }
    }

    .site-footer { display: none !important; }
</style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">
      <!-- O título 'Minhas Histórias' volta a ser clicável para ir para a página inicial -->
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}

      <!-- CAIXA DE COMENTÁRIOS AUTOMÁTICA NOS CAPÍTULOS -->
      {% if page.layout == "post" %}
              <!-- BARRA FLUTUANTE DE LEITURA -->
        <div class="reader-settings">
          <!-- Tamanho da Fonte -->
          <button class="reader-btn" onclick="adjustFontSize(-0.1)" title="Diminuir Fonte">A-</button>
          <button class="reader-btn" onclick="adjustFontSize(0.1)" title="Aumentar Fonte">A+</button>
          
          <!-- Alternar Fontes -->
          <button class="reader-btn" onclick="cycleFont()" id="btnFont" title="Mudar Fonte">Merriweather</button>
          
          <!-- Espaçamento entre Parágrafos -->
          <button class="reader-btn" onclick="cycleSpacing()" id="btnSpacing" title="Espaçamento de Parágrafos">⭥ Normal</button>
          
          <!-- Temas -->
          <button class="reader-btn" onclick="cycleTheme()" id="btnTheme" title="Mudar Tema">🎨</button>
        </div>
      
        <script>
          // Configurações padrão salvas
          let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 1.18;
          let currentFont = localStorage.getItem('reader_font_family') || 'merriweather';
          let currentSpacing = localStorage.getItem('reader_spacing') || 'normal';
          let currentTheme = localStorage.getItem('reader_theme') || 'mocha';
      
          const fonts = [
            { id: 'merriweather', name: 'Merriweather' },
            { id: 'lora', name: 'Lora' },
            { id: 'outfit', name: 'Outfit' },
            { id: 'inter', name: 'Inter' }
          ];
      
          const spacings = [
            { id: 'compact', name: '⭥ Fair' },
            { id: 'normal', name: '⭥ Normal' },
            { id: 'relaxed', name: '⭥ Wide' }
          ];
      
          function applyReaderSettings() {
            // 1. Tamanho da Fonte
            const paragraphs = document.querySelectorAll('.post-content, .post-content p');
            paragraphs.forEach(p => {
              p.style.fontSize = currentFontSize + 'rem';
            });
      
            // 2. Tipo de Fonte
            document.body.classList.remove('font-merriweather', 'font-lora', 'font-outfit', 'font-inter');
            document.body.classList.add('font-' + currentFont);
      
            const fontObj = fonts.find(f => f.id === currentFont);
            if (fontObj) {
              document.getElementById('btnFont').innerText = fontObj.name;
            }
      
            // 3. Espaçamento entre Parágrafos
            document.body.classList.remove('spacing-compact', 'spacing-normal', 'spacing-relaxed');
            document.body.classList.add('spacing-' + currentSpacing);
      
            const spaceObj = spacings.find(s => s.id === currentSpacing);
            if (spaceObj) {
              document.getElementById('btnSpacing').innerText = spaceObj.name;
            }
      
            // 4. Tema de Cores
            document.body.classList.remove('theme-dark-pure', 'theme-sepia', 'theme-light');
            if (currentTheme !== 'mocha') {
              document.body.classList.add('theme-' + currentTheme);
            }
          }
      
          function adjustFontSize(delta) {
            currentFontSize = Math.min(Math.max(currentFontSize + delta, 0.9), 1.8);
            currentFontSize = Math.round(currentFontSize * 100) / 100;
            localStorage.setItem('reader_font_size', currentFontSize);
            applyReaderSettings();
          }
      
          function cycleFont() {
            let fontIds = fonts.map(f => f.id);
            let nextIndex = (fontIds.indexOf(currentFont) + 1) % fontIds.length;
            currentFont = fontIds[nextIndex];
            localStorage.setItem('reader_font_family', currentFont);
            applyReaderSettings();
          }
      
          function cycleSpacing() {
            let spaceIds = spacings.map(s => s.id);
            let nextIndex = (spaceIds.indexOf(currentSpacing) + 1) % spaceIds.length;
            currentSpacing = spaceIds[nextIndex];
            localStorage.setItem('reader_spacing', currentSpacing);
            applyReaderSettings();
          }
      
          function cycleTheme() {
            const themes = ['mocha', 'dark-pure', 'sepia', 'light'];
            let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
            currentTheme = themes[nextIndex];
            localStorage.setItem('reader_theme', currentTheme);
            applyReaderSettings();
          }
      
          document.addEventListener('DOMContentLoaded', applyReaderSettings);
          applyReaderSettings();
        </script>
            <!-- SEÇÃO DE COMENTÁRIOS (GISCUS) -->
        <section style="margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--borda-suave);">
          <h3 style="font-family: var(--fonte-titulo); color: var(--detalhe-accent); margin-bottom: 20px;">
            🗨 Comments
          </h3>
          
          <div class="giscus"></div>
      
          <script src="https://giscus.app/client.js"
                  data-repo="soleumn/soleumn.github.io"
                  data-repo-id="R_kgDOUW772g"
                  data-category="Announcements"
                  data-category-id="DIC_kwDOUW772s4DFZrd"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="top"
                  data-theme="catppuccin_mocha"
                  data-lang="en"
                  crossorigin="anonymous"
                  async>
          </script>
        </section>
      {% endif %}
    </div>
  </main>

</body>
</html>
