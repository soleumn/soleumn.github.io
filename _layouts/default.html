<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* CONFIGURAÇÃO BASE (CATPPUCCIN MOCHA - DARK) */
    :root {
      --bg-principal: #1e1e2e;
      --bg-card: #181825;
      --bg-card-hover: #313244;
      --borda-suave: #45475a;
      --texto-principal: #cdd6f4;
      --texto-titulo: #f5e0dc;
      --texto-secundario: #a6adc8;
      --detalhe-accent: #cba6f7;
      --detalhe-hover: #b4befe;
      --fonte-titulo: 'Outfit', sans-serif;
      --fonte-corpo: 'Merriweather', serif;
      --cor-sistema: #89b4fa;
    }
    body {
      background-color: var(--bg-principal) !important;
      color: var(--texto-principal) !important;
      margin: 0;
      padding: 0;
    }

    /* TIPOGRAFIA */
    h1, h2, h3, h4 {
      font-family: var(--fonte-titulo) !important;
      color: var(--texto-titulo) !important;
    }

    .post-content, .post-content p {
      font-family: var(--fonte-corpo) !important;
      line-height: 2 !important;
      color: var(--texto-principal) !important;
    }

    a {
      color: var(--detalhe-accent) !important;
      transition: color 0.2s ease;
    }
    a:hover {
      color: var(--detalhe-hover) !important;
    }

    /* CABEÇALHO */
    .site-header { 
      background-color: rgba(24, 24, 37, 0.9) !important;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--borda-suave) !important; 
    }
    .site-title, .site-title:visited { 
      color: #f5e0dc !important; 
      font-weight: 700;
      font-family: var(--fonte-titulo) !important;
      text-decoration: none !important;
    }

    /* CAPAS DE OBRAS */
    .card-historia img, 
    .capa-obra {
      width: 100% !important;
      height: auto !important;
      max-height: 380px;
      object-fit: contain !important;
      border-radius: 8px 8px 0 0;
      display: block;
    }
    
    /* JANELA DO SISTEMA */
    .system-window {
      background: var(--bg-card) !important;
      border: 1px solid var(--cor-sistema) !important;
      border-left: 4px solid var(--cor-sistema) !important;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 25px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center !important;
      color: var(--texto-principal) !important;
    }

    .system-header {
      font-family: var(--fonte-titulo) !important;
      font-size: 0.95rem !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cor-sistema) !important;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .system-content {
      font-family: inherit;
      font-size: inherit !important;
      line-height: 1.6 !important;
      color: var(--texto-principal) !important;
    }

    /* GARANTE QUE O CONTEÚDO FIQUE SEMPRE CENTRALIZADO E LIMPANDO OVERFLOW */
    .wrapper, .page-content {
      overflow-x: hidden !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    .post-content {
      width: 100% !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
    }

        /* FORÇA O ALINHAMENTO DO TEXTO CENTRALIZADO NO MOBILE */
    .post-content p {
      text-align: left !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    .post-content {
      display: block !important;
      float: none !important;
      clear: both !important;
      margin: 0 auto !important;
    }
    
    /* PAINEL DE LEITURA FLUTUANTE */
    .reader-settings {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 95vw;
      overflow-x: auto;
      
      /* ESCONDE A BARRA POR PADRÃO */
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: opacity 0.3s ease, visibility 0.3s ease !important;
    }
    
    /* CLASSE QUE MOSTRA A BARRA APENAS NO TEXTO */
    .reader-settings.is-visible {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }
        
    .reader-btn {
      background: transparent;
      border: 1px solid var(--borda-suave);
      color: var(--texto-principal);
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-family: var(--fonte-titulo);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .select-capitulo-flutuante {
      background-color: var(--bg-card) !important;
      color: var(--texto-principal) !important;
      border: 1px solid var(--borda-suave) !important;
      border-radius: 16px !important;
      padding: 4px 10px !important;
      font-size: 0.85rem !important;
      outline: none !important;
      cursor: pointer !important;
      max-width: 130px !important;
      text-overflow: ellipsis !important;
    }
    
    .select-capitulo-flutuante option {
      background-color: var(--bg-card) !important;
      color: var(--texto-principal) !important;
    }
    
    .btn-floating {
      background-color: transparent !important;
      color: var(--texto-principal) !important;
      border: 1px solid var(--borda-suave) !important;
      padding: 4px 10px !important;
      border-radius: 16px !important;
      text-decoration: none !important;
      font-size: 0.8rem !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    
    .btn-floating:hover {
      border-color: var(--detalhe-accent) !important;
      color: var(--detalhe-accent) !important;
    }

    /* BOTOES DE NAVEGACAO DO CAPITULO */
    .nav-capitulo-container {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      margin: 40px 0 !important;
      width: 100% !important;
    }
    
    .nav-grupo-esquerda {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }
    
    .nav-grupo-direita {
      display: flex !important;
      align-items: center !important;
    }

    .btn-nav {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 10px 18px !important;
      border-radius: 8px !important;
      font-family: var(--fonte-titulo) !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      background-color: var(--bg-card) !important;
      color: var(--texto-principal) !important;
      border: 1px solid var(--borda-suave) !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      box-sizing: border-box !important;
    }

    .btn-nav:hover {
      background-color: var(--bg-card-hover) !important;
      color: #ffffff !important;
      transform: translateY(-2px);
    }

    .btn-next {
      background-color: var(--detalhe-accent) !important;
      color: #11111b !important;
      border: none !important;
    }

    .btn-next:hover {
      background-color: var(--detalhe-hover) !important;
      color: #11111b !important;
    }

    /* TEMAS DE LEITURA */
    body.theme-dark-pure {
      --bg-principal: #000000 !important;
      --bg-card: #121212 !important;
      --bg-card-hover: #1e1e1e !important;
      --texto-principal: #e0e0e0 !important;
      --texto-titulo: #ffffff !important;
      --borda-suave: #2a2a2a !important;
      --cor-sistema: #89b4fa !important;
    }

    body.theme-sepia {
      --bg-principal: #f4ecd8 !important;
      --bg-card: #e8dfca !important;
      --bg-card-hover: #dfd4bc !important;
      --texto-principal: #433422 !important;
      --texto-titulo: #2c1d11 !important;
      --borda-suave: #d3c4a5 !important;
      --detalhe-accent: #8c5a2b !important;
      --detalhe-hover: #6d441f !important;
      --cor-sistema: #8c5a2b !important;
    }

    body.theme-light {
      --bg-principal: #eff1f5 !important;
      --bg-card: #e6e9ef !important;
      --bg-card-hover: #dce0e8 !important;
      --texto-principal: #4c4f69 !important;
      --texto-titulo: #1e1e2e !important;
      --borda-suave: #ccd0da !important;
      --detalhe-accent: #8839ef !important;
      --detalhe-hover: #7223e5 !important;
      --cor-sistema: #1e66f5 !important;
    }

    /* FONTES E ESPAÇAMENTOS */
    body.font-merriweather .post-content, body.font-merriweather .post-content p, body.font-merriweather .system-window { font-family: 'Merriweather', serif !important; }
    body.font-lora .post-content, body.font-lora .post-content p, body.font-lora .system-window { font-family: 'Lora', serif !important; }
    body.font-outfit .post-content, body.font-outfit .post-content p, body.font-outfit .system-window { font-family: 'Outfit', sans-serif !important; }
    body.font-inter .post-content, body.font-inter .post-content p, body.font-inter .system-window { font-family: 'Inter', sans-serif !important; }
    body.font-georgia .post-content, body.font-georgia .post-content p, body.font-georgia .system-window { font-family: 'Georgia', serif !important; }
    
    body.spacing-compact .post-content p { margin-bottom: 0.8rem !important; }
    body.spacing-normal .post-content p { margin-bottom: 1.5rem !important; }
    body.spacing-relaxed .post-content p { margin-bottom: 2.3rem !important; }

     /* RESPONSIVIDADE MOBILE */
    @media (max-width: 768px) {
      .wrapper {
        padding-left: 15px !important;
        padding-right: 15px !important;
      }
  
      .post-content, .post-content p {
        line-height: 1.8 !important;
      }
  /* Esconde o texto do espaçamento para economizar espaço */
      #btnSpacing {
        font-size: 0.7rem !important;
      }
      /* BARRA FLUTUANTE COMPACTA & SEM SCROLLBAR VISÍVEL */
      .reader-settings {
        bottom: 10px !important;
        padding: 4px 8px !important;
        gap: 4px !important;
        max-width: 92vw !important;
        border-radius: 20px !important;
        -ms-overflow-style: none;  /* IE/Edge */
        scrollbar-width: none;  /* Firefox */
      }
  
      .reader-settings::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
      }
  
      .reader-btn {
        padding: 3px 6px !important;
        font-size: 0.75rem !important;
        border-radius: 12px !important;
      }
  
      .select-capitulo-flutuante {
        max-width: 85px !important;
        font-size: 0.75rem !important;
        padding: 2px 4px !important;
        border-radius: 12px !important;
      }
  
      .btn-floating {
        padding: 2px 6px !important;
        font-size: 0.75rem !important;
        border-radius: 12px !important;
      }
  
      img, .system-window {
        max-width: 100% !important;
        box-sizing: border-box !important;
      }
  
      .nav-capitulo-container {
        flex-direction: column !important;
        gap: 10px !important;
      }
  
      /* CORREÇÃO DO ALINHAMENTO DOS BOTÕES DE NAVEGAÇÃO NO MOBILE */
      .nav-grupo-esquerda,
      .nav-grupo-direita {
        width: 100% !important;
        flex-direction: column !important;
        gap: 10px !important;
      }
  
      .btn-nav {
        width: 100% !important;
        text-align: center !important;
        white-space: nowrap !important; /* Impede que o texto quebre em duas linhas */
        padding: 12px 10px !important;
      }
    }

    .site-footer { display: none !important; }

    .post-meta, time, [itemprop="datePublished"] {
      display: none !important;
    }

        /* AJUSTE PARA CÓDIGO INLINE (CRASES ` `) ADAPTÁVEL AOS TEMAS */
    .post-content code {
      background-color: var(--bg-card, rgba(255, 255, 255, 0.1)) !important;
      color: var(--cor-sistema, var(--texto-principal)) !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }

          /* EFEITO GLITCH INTENSO */
    .glitch {
      position: relative;
      display: inline-block;
      color: var(--texto-principal);
      font-weight: bold;
      /* Brilho neon de fundo para destacar no texto */
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
    }
    
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }
    
    /* Camada Vermelha/Rosa (Desloca para a esquerda) */
    .glitch::before {
      left: -4px; /* Aumentado o desvio */
      text-shadow: 3px 0 #ff0055, -1px 0 #ff0055;
      animation: glitch-anim-1 0.6s infinite linear alternate-reverse; /* Mais rápido */
    }
    
    /* Camada Azul/Ciano (Desloca para a direita) */
    .glitch::after {
      left: 4px; /* Aumentado o desvio */
      text-shadow: -3px 0 #00e5ff, 1px 0 #00e5ff;
      animation: glitch-anim-2 0.3s infinite linear alternate-reverse; /* Mais rápido */
    }
    
    /* Animação com cortes mais agressivos e salto de posição */
    @keyframes glitch-anim-1 {
      0% { clip: rect(10px, 9999px, 85px, 0); transform: skew(0.6deg); }
      10% { clip: rect(65px, 9999px, 15px, 0); transform: skew(-2deg); }
      20% { clip: rect(30px, 9999px, 70px, 0); transform: translate(-2px, 1px); }
      30% { clip: rect(85px, 9999px, 5px, 0); transform: skew(1.5deg); }
      40% { clip: rect(5px, 9999px, 95px, 0); transform: translate(3px, -1px); }
      50% { clip: rect(50px, 9999px, 30px, 0); transform: skew(-1deg); }
      60% { clip: rect(15px, 9999px, 60px, 0); transform: translate(-3px, 0); }
      70% { clip: rect(90px, 9999px, 10px, 0); transform: skew(2deg); }
      80% { clip: rect(25px, 9999px, 40px, 0); transform: translate(2px, 2px); }
      90% { clip: rect(70px, 9999px, 20px, 0); transform: skew(-0.5deg); }
      100% { clip: rect(40px, 9999px, 80px, 0); transform: translate(0, 0); }
    }
    
    @keyframes glitch-anim-2 {
      0% { clip: rect(80px, 9999px, 10px, 0); transform: translate(2px, -1px); }
      15% { clip: rect(15px, 9999px, 55px, 0); transform: skew(-2deg); }
      30% { clip: rect(50px, 9999px, 25px, 0); transform: translate(-2px, 1px); }
      45% { clip: rect(5px, 9999px, 90px, 0); transform: skew(3deg); }
      60% { clip: rect(70px, 9999px, 35px, 0); transform: translate(3px, 0); }
      75% { clip: rect(30px, 9999px, 65px, 0); transform: skew(-1deg); }
      90% { clip: rect(95px, 9999px, 5px, 0); transform: translate(-1px, -2px); }
      100% { clip: rect(20px, 9999px, 75px, 0); transform: translate(0, 0); }
    }
    
               /* GLITCH: TEXTO PARADO COM CORES EM MOVIMENTO */
    .glitch-static {
      position: relative;
      display: inline-block;
      font-weight: bold;
      color: var(--texto-principal);
    }
    
        /* Camada Rosa (Esquerda) */
    .glitch-static::before {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--texto-principal);
      text-shadow: -1px 0 #ff0055;
      clip-path: inset(0 0 0 0);
      /* Alterado de 1.5s para 0.2s */
      animation: glitch-color-1 0.2s infinite ease-in-out alternate;
      pointer-events: none;
    }
    
    /* Camada Ciano (Direita) */
    .glitch-static::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--texto-principal);
      text-shadow: 1px 0 #00e5ff;
      clip-path: inset(0 0 0 0);
      /* Alterado de 2s para 0.15s */
      animation: glitch-color-2 0.15s infinite ease-in-out alternate;
      pointer-events: none;
    }
    
    /* Movimento suave apenas da sombra rosa */
    @keyframes glitch-color-1 {
      0%   { text-shadow: -1px 0 #ff0055; opacity: 0.5; }
      50%  { text-shadow: -3px 0 #ff0055; opacity: 0.7; }
      100% { text-shadow: -1.5px 0 #ff0055; opacity: 0.3; }
    }
    
    /* Movimento suave apenas da sombra ciano */
    @keyframes glitch-color-2 {
      0%   { text-shadow: 1.5px 0 #00e5ff; opacity: 0.3; }
      50%  { text-shadow: 3px 0 #00e5ff; opacity: 0.7; }
      100% { text-shadow: 1px 0 #00e5ff; opacity: 0.4; }
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}

      {% if page.layout == "post" %}
        <!-- SEÇÃO DE COMENTÁRIOS (GISCUS) -->
        <section style="margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--borda-suave);">
          <h3 style="font-family: var(--fonte-titulo); color: var(--detalhe-accent); margin-bottom: 20px;">
            🗨 Comments
          </h3>
          
          <div class="giscus"></div>
      
          <script src="https://giscus.app/client.js"
                  data-repo="soleumn/soleumn.github.io"
                  data-repo-id="R_kgDOUW772g"
                  data-category="Announcements"
                  data-category-id="DIC_kwDOUW772s4DFZrd"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="top"
                  data-theme="catppuccin_mocha"
                  data-lang="en"
                  crossorigin="anonymous"
                  async>
          </script>
        </section>
      {% endif %}
    </div>
  </main>

  <!-- SCRIPT GLOBAL DO LEITOR (MUDANÇA DE TEMA/FONTE/ESPAÇAMENTO) -->
  <script>
    let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 1.18;
    let currentFont = localStorage.getItem('reader_font_family') || 'merriweather';
    let currentSpacing = localStorage.getItem('reader_spacing') || 'normal';
    let currentTheme = localStorage.getItem('reader_theme') || 'mocha';

    const fonts = [
      { id: 'georgia', name: 'Georgia' },
      { id: 'merriweather', name: 'Merriweather' },
      { id: 'lora', name: 'Lora' },
      { id: 'outfit', name: 'Outfit' },
      { id: 'inter', name: 'Inter' }
    ];

    const spacings = [
      { id: 'compact', name: '⬍ Fair' },
      { id: 'normal', name: '⬍ Normal' },
      { id: 'relaxed', name: '⬍ Wide' }
    ];

    function applyReaderSettings() {
      const paragraphs = document.querySelectorAll('.post-content, .post-content p, .system-window, .system-content');
      paragraphs.forEach(p => {
        p.style.fontSize = currentFontSize + 'rem';
      });

      document.body.classList.remove('font-georgia', 'font-merriweather', 'font-lora', 'font-outfit', 'font-inter');
      document.body.classList.add('font-' + currentFont);

      const btnFont = document.getElementById('btnFont');
      const fontObj = fonts.find(f => f.id === currentFont);
      if (btnFont && fontObj) {
        btnFont.innerText = fontObj.name;
      }

      document.body.classList.remove('spacing-compact', 'spacing-normal', 'spacing-relaxed');
      document.body.classList.add('spacing-' + currentSpacing);

      const btnSpacing = document.getElementById('btnSpacing');
      const spaceObj = spacings.find(s => s.id === currentSpacing);
      if (btnSpacing && spaceObj) {
        btnSpacing.innerText = spaceObj.name;
      }

      document.body.classList.remove('theme-dark-pure', 'theme-sepia', 'theme-light');
      if (currentTheme !== 'mocha') {
        document.body.classList.add('theme-' + currentTheme);
      }
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta, 0.9), 1.8);
      currentFontSize = Math.round(currentFontSize * 100) / 100;
      localStorage.setItem('reader_font_size', currentFontSize);
      applyReaderSettings();
    }

    function cycleFont() {
      let fontIds = fonts.map(f => f.id);
      let nextIndex = (fontIds.indexOf(currentFont) + 1) % fontIds.length;
      currentFont = fontIds[nextIndex];
      localStorage.setItem('reader_font_family', currentFont);
      applyReaderSettings();
    }

    function cycleSpacing() {
      let spaceIds = spacings.map(s => s.id);
      let nextIndex = (spaceIds.indexOf(currentSpacing) + 1) % spaceIds.length;
      currentSpacing = spaceIds[nextIndex];
      localStorage.setItem('reader_spacing', currentSpacing);
      applyReaderSettings();
    }

    function cycleTheme() {
      const themes = ['mocha', 'dark-pure', 'sepia', 'light'];
      let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      currentTheme = themes[nextIndex];
      localStorage.setItem('reader_theme', currentTheme);
      applyReaderSettings();
    }

    document.addEventListener('DOMContentLoaded', applyReaderSettings);
  </script>

</body>
</html>
