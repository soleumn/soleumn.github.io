<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}

<script>
  (function () {
    try {
      var d = document.documentElement, g = function (k) { return localStorage.getItem(k); };
      /* Tema do SITE (claro/escuro): home e páginas das histórias */
      var st = g('site_theme');
      if (st !== 'light' && st !== 'dark') st = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      d.dataset.siteTheme = st;
      /* Temas do LEITOR: só valem dentro dos capítulos */
      d.dataset.theme = g('reader_theme') || 'mocha';
      d.dataset.font = g('reader_font_family') || 'literata';
      d.dataset.spacing = g('reader_spacing') || 'normal';
      var s = parseFloat(g('reader_font_size'));
      if (s) d.style.setProperty('--reader-size', s + 'rem');
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
