<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}

<script>
  (function () {
    try {
      var d = document.documentElement, g = function (k) { return localStorage.getItem(k); };
      /* Tema do SITE (claro/escuro): home e páginas das histórias */
      var st = g('site_theme');
      if (st !== 'light' && st !== 'dark') st = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      d.dataset.siteTheme = st;
      d.dataset.siteStyle = g('site_style') === 'cyber' ? 'cyber' : 'classic';
      var sz = g('site_size');
      d.dataset.siteSize = (sz === 'sm' || sz === 'lg' || sz === 'xl') ? sz : 'md';
      d.dataset.siteFx = g('site_fx') === 'off' ? 'off' : 'on';
      {% unless page.layout == "post" %}
      if (d.dataset.siteStyle === 'cyber') {
        var cf = document.createElement('link');
        cf.id = 'cyberFonts'; cf.rel = 'stylesheet';
        cf.href = 'https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400;700&display=swap';
        document.head.appendChild(cf);
      }
      {% endunless %}
      /* Temas do LEITOR: só valem dentro dos capítulos */
      d.dataset.theme = g('reader_theme') || 'mocha';
      d.dataset.font = g('reader_font_family') || 'literata';
      d.dataset.spacing = g('reader_spacing') || 'normal';
      var s = parseFloat(g('reader_font_size'));
      if (s) d.style.setProperty('--reader-size', s + 'rem');
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% if page.layout == "post" %}
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Jersey+10&display=swap" rel="stylesheet">
{% else %}
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/webnovel.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/format.css' | relative_url }}">
